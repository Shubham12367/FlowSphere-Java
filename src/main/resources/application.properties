# Database Configuration with Environment Variable support and sensible local fallbacks
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/flowsphere_db?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA & Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false

# Spring MVC JSP View Resolver
spring.mvc.view.prefix=/WEB-INF/jsp/
spring.mvc.view.suffix=.jsp

# Embedded Server Configuration (for local testing / standalone jar execution)
server.port=8080
server.servlet.session.timeout=1800
server.servlet.context-path=/

# Logging
logging.level.org.springframework=INFO
logging.level.com.flowsphere=INFO
